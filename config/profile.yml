levers:
  - id: cancellation_prevention
    effect: 1.0
    confidence: high
    evidence: "6 cancellations worth $1,064 in 19 days, inside the exact window the impression collapse began. A directly scored area."
  - id: inorganic_reduction
    effect: 0.90
    confidence: medium
    caveat: "Correlation, not causation. The cancellation cluster occupies the same window and this dataset cannot separate them. The remedy sets overlap, so act on both."
    evidence: "XStudioz 74% inorganic, Success Score 8, 1,564 impressions. Dygram 44%, Success Score 9, 12,700 impressions."
  - id: delivery_speed
    effect: 0.75
    confidence: high
    evidence: "Observed 4-12 days against a 2-3 day category median. On-time delivery is one of six scored areas, and Fiverr prioritises fast deliverers when it detects buyer urgency."
  - id: intake_script
    effect: 0.70
    confidence: medium
    evidence: "A visible 4.7 review cites missing files and a watermark. A cancellation is annotated as a client not knowing an editable file needs the font installed. Both hit quality and value sub-ratings simultaneously."
  - id: dead_pipeline_recovery
    effect: 0.60
    confidence: medium
    evidence: "$5,472 quoted and never followed up across 19 named leads. 15% recovery is $820, for zero ad spend and no new traffic."
  - id: mid_order_checkpoint
    effect: 0.55
    confidence: medium
    evidence: "Private ratings are invisible and heavily weighted. A 50%-elapsed check converts a silent 3-star private rating into a fixed order."
  - id: upsell_on_inquiry
    effect: 0.763
    n: 1000
    confidence: medium
    caveat: "Observational. CSRs upsell warmer leads, so part of this is selection."
    evidence: "Inquiry sheet: upsell=TRUE n=70 conv 54.3%; upsell=FALSE n=930 conv 30.8%; z=4.05"
  - id: repeat_client_focus
    effect: 0.70
    confidence: high
    evidence: "158 of 574 clients are repeat (27.5%), producing 48.2% of orders and $38,724 of $91,544 revenue, while the Upsell column sits at 0.0% filled."
    caveat: "Repeat orders do NOT count toward the Top Rated unique-client gate — this lever serves revenue, not the level gate."

