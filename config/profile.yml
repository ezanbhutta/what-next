    - id: effective_communication
      label: Effective communication
      measures: "Responsiveness, helpfulness, clear expectations"
      exposure: "4.9"
      status: strength
    - id: conflict_free_orders
      label: Conflict-free orders
      measures: "How often disputes arise"
      exposure: "Font-file dispute logged"
      status: watch
    - id: cancellations
      label: Cancellations
      measures: "Effect of cancellations on the order process"
      exposure: "6 in 19 days"
      status: critical
    - id: on_time_delivery
      label: On-time delivery
      measures: "Frequency of on-time and early delivery"
      exposure: "4-12 day range vs 2-3 day category median"
      status: critical
    - id: value_for_money
      label: Value for money
      measures: "Whether clients felt they got what they paid for"
      exposure: "Value sub-rating 4.8"
      status: drag
  mechanics:
    peer_relative: true
    benchmark: "Other freelancers in the same subcategory AND price range"
    weighting: "Gigs with more orders weigh more. Within a gig, higher-value and more recent orders weigh more."
    private_ratings: >
      Anonymous questionnaire 24h after the public review, open for 60 days.
      First-time buyers' private ratings are weighted more heavily than repeat
      customers'. Invisible to the seller. This is why a wall of 5-star public
      reviews can sit alongside a falling Success Score.
    does_not_hurt: [unresponsive_clients, revisions, delivery_extensions, partial_refunds, inactivity]

