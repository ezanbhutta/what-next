  max_source_staleness_days: 3
  min_tasks: 3
  max_tasks: 12
  require_evidence_on_every_task: true
  require_falsifiable_resolution_on_every_prediction: true
  max_unexplained_metric_swing: 0.40
  min_rubric_score: 70          # out of 100
