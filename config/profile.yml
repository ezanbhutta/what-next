# ---------------------------------------------------------------------------
# VVRO DOSING CONTROLLER
# ---------------------------------------------------------------------------
dosing:
  # OFF, at the CEO's instruction (2026-07-29). Inorganic volume is directed by
  # the CEO, not by this engine. With this false the engine emits no dose, no
  # quota, no price bands, no country mix and no schedule, and neither the
  # brief nor the dashboard mentions the subject at all.
  #
  # Consequence, stated so it is a choice and not a surprise: the engine can no
  # longer tell you whether inorganic volume is affecting organic flow, because
  # that analysis is the thing being removed. It still tracks organic orders —
  # that is the objective — and still reports when organic flow is declining.
  # It just will not attribute the decline to inorganic volume any more.
  enabled: false
  min_per_day: 0
  max_per_day: 5
  # 0.45 -> 0.30 per operating model 3.6. Dygram holds Success Score 9 at 44%,
  # but XStudioz is the premium-AOV profile sitting one point from Top Rated,
  # and low-value controlled volume dilutes the highest-weighted signal in the
  # scoring model on exactly the profile that can least afford it.
  max_vvro_share: 0.30
  current_vvro_share: 0.74
  step_up: 1
  step_down: 2
  price_bands:
    - {min: 45,  max: 85,   weight: 0.10}
    - {min: 86,  max: 150,  weight: 0.30}
    - {min: 151, max: 260,  weight: 0.40}
    - {min: 261, max: 450,  weight: 0.20}
  price_band_note: >
    Weighted upward from the previous distribution. Inorganic AOV is $77
    against $147 organic; Fiverr weights higher-value orders more heavily,
    so cheap controlled volume is the worst of both worlds.
  country_mix:
    United States: 0.32
    United Kingdom: 0.18
    Australia: 0.10
    Canada: 0.07
    Germany: 0.06
    United Arab Emirates: 0.05
    Netherlands: 0.04
    Other: 0.18
  cooldown_after_breach_days: 3

