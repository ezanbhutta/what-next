# ---------------------------------------------------------------------------
# COMPLIANCE — from the team briefing. These are account-safety rules, and
# they outrank every growth consideration in this file.
# ---------------------------------------------------------------------------
compliance:
  never:
    - "Move a pre-order conversation off Fiverr. Before an order exists, everything stays in the inbox."
    - "Accept or propose payment outside Fiverr. There is no window where this is acceptable."
    - "Pressure a buyer for a review or a rating. Integrity and Authenticity violation."
    - "Argue with a buyer. The metrics read negative sentiment from either side; matching their energy is what hurts."
    - "Deliver drafts through the Delivery button. Drafts go in the order message thread."
  enforcement_ladder:
    warning: "Emailed. Expires after 90 days. Freezes level progression."
    second_same: suspension
    three_different: suspension
    restriction: "60 days limited access, then permanent suspension"
    appeal_window_months: 6
  standing_risks:
    - id: multi_account_pattern
      source: "Team briefing §4 enforcement triggers; operating model 7.1"
      detail: >
        Both of the source documents flag this. The briefing lists "multiple
        accounts operated by one person" as an enforcement trigger, and the
        operating model notes that four people sharing one password across four
        devices is the exact pattern platform integrity systems look for. A
        Team Account is the legitimate mechanism and is currently unavailable.
        Recorded so the exposure is deliberate rather than forgotten.
  unresolved_conflict:
    - id: review_request
      between: ["Team briefing Rule 7", "Operating model step 12"]
      briefing_says: "Never ask for a review or a rating."
      operating_model_says: "Deliver at 60% of promised time, then request the review."
      engine_position: >
        The engine follows the stricter reading where they diverge, because the
        downside is asymmetric: a soft review request wins a few reviews, and an
        Integrity violation costs the account. Fiverr's published prohibition is
        on PRESSURING or incentivising, not on a single neutral mention, so the
        synthesis the engine recommends is: one neutral line at delivery, never
        repeated, never specifying a rating, never tied to anything of value.
        Resolve this properly and record the decision in docs/DECISIONS.md.

# ---------------------------------------------------------------------------
# LEVERS — measured effect sizes used to rank daily tasks.
