# XStudioz Growth Engine — objective function and operating constraints.
#
# Realigned 2026-07-29 to the XStudioz Operating Model (27 July 2026) and the
# Fiverr monitoring team briefing. Those documents carry impressions data the
# sheets do not, and they overturn the objective this file previously encoded.
#
# What changed and why:
#   - The OBJECTIVE is unchanged and permanent: revenue and organic order
#     growth. Success Score and impressions are not competing goals, they are
#     the mechanism that produces organic orders, and the operating model
#     found the mechanism is broken at its first link.
#   - Queue depth is removed as a target entirely. "WIP is inventory, not
#     revenue. It is the one number that lies to you."
#   - max_vvro_share drops 0.45 -> 0.30, per the ratio policy in 3.6.
#
# Everything the engine decides derives from this file. Change numbers here,
# never in code.

profile:
  name: X Studioz
  fiverr_username: x_studioz
  member_since: 2023-06
  level: Level 2
  primary_gig: design-modern-logo-branding-kit-with-complete-brand-identity
  operating_model:
    document: docs/source/XStudioz_Operating_Model.pdf
    dated: 2026-07-27
    horizon: 2026-08-30
    review_on: 2026-08-10        # Phase 1 gate; re-run the diagnosis here

# ---------------------------------------------------------------------------
# OBJECTIVE — permanent, and it does not move.
#
#   Maximise REVENUE and ORGANIC ORDER GROWTH.
#
# Everything else in this file is mechanism, not goal. The causal chain the
# operating model establishes is:
#
#     Success Score  ->  impressions  ->  organic orders  ->  revenue
#
# Buyers who see XStudioz still buy at 12.05%; conversion never broke. Fiverr
# has largely stopped showing XStudioz — impressions fell 86% from 11,092/day
# in April to 1,564/day in July. So the chain is severed at its first link,
# and that is where effort goes right now. Success Score and impressions are
# the current binding constraint on the objective, not a replacement for it.
#
# When the chain is repaired, the same objective will point the work somewhere
# else. The objective never changes; the binding constraint does.
#
# Two things this rules out, permanently:
#   - Optimising order COUNT at the expense of order VALUE. Fiverr weights
#     higher-value and more recent orders more heavily, and weights private
#     ratings from new buyers most heavily of all.
#   - Buying volume that suppresses distribution. Inorganic orders that cost
#     impressions cost organic orders, which costs revenue. That is the
#     objective arguing against them, not a separate rule.
# ---------------------------------------------------------------------------
objective:
  maximise: [revenue, organic_orders]
  # The mechanism through which the objective is currently reachable. Reassess
  # at the 2026-08-10 gate: if impressions recover and revenue does not, the
  # binding constraint has moved and this block should be rewritten.
  binding_constraint_now: success_score
  leading_indicator: impressions
  causal_chain: [success_score, impressions, organic_orders, revenue]
  explicitly_not_a_target:
    - id: queue_depth
      why: >
        Work in progress is inventory. At 2 orders/day a 65-order queue implies
        a 32-day cycle time, which reproduces the conditions that generated the
        worst review on the profile. The engine must never recommend growing
        the queue.
    - id: total_order_count_via_inorganic
      why: >
        Organic order growth IS the objective. Total order count bought with
        inorganic volume is not the same thing and can move opposite to it:
        Fiverr weights higher-value and more recent orders more heavily, and
        weights private ratings from new buyers most heavily of all, so cheap
        controlled volume dilutes the signals that produce distribution. The
        engine counts organic orders toward the objective and treats inorganic
        orders as a cost against it.

  subject_to:
    - id: organic_non_declining
      metric: organic_orders_7d_ma
      lookback_days: 14
      tolerance: -0.05
      hard: true
    - id: success_score_floor
      metric: success_score
      min: 7                    # below 7 Fiverr brief routing cuts off entirely
      hard: true
      why: "Losing Success Score 7 removes inbound brief demand completely."
    - id: rating_floor
      metric: gig_rating
      min: 4.70
      hard: true
    - id: cancellations
      metric: cancellations_30d
      max: 0
      hard: true
      why: "A directly scored Success Score area. Six in 19 days sat in the exact window the impression collapse began."
    - id: completion_ratio
      metric: completion_ratio_5d
      min: 1.0
      hard: false
      why: "Completed / received. Below 1.0 for five straight days means stop accepting new orders on the branding kit gig."

# ---------------------------------------------------------------------------
# PHASE STATE MACHINE
# The operating model runs two phases with a hard gate between them. The engine
# refuses to recommend a Phase 2 action while Phase 1 is active — that is the
# whole point of a gate.
# ---------------------------------------------------------------------------
phases:
  current: signal_repair
  definitions:
    - id: signal_repair
      label: "Phase 1 · Signal repair"
      window: [2026-07-28, 2026-08-10]
      objective: "Stop the damage. Do not grow the queue. Do not spend on ads."
      allowed:
        - cancellation_prevention
        - inorganic_reduction
        - intake_script
        - delivery_speed
        - qa_gate
        - dead_pipeline_recovery
        - followup_discipline
        - log_reconciliation
        - request_to_order
        - shift_coverage
      forbidden:
        - fiverr_ads
        - new_gig_launch
        - queue_growth
        - price_increase
      forbidden_why:
        fiverr_ads: >
          Paying for clicks on a profile with suppressed organic distribution
          buys past a penalty instead of clearing it. The ROI maths works at
          7-14% of net; the timing does not. Gate it behind Phase 2.
        new_gig_launch: >
          The gig launched 20 July received 139, 17, 18, 9, 10, 6, 3, 8
          impressions. A new gig on a healthy profile gets a 48-72h visibility
          window; this one got nothing. The suppression is at profile level,
          so launching more gigs cannot fix it yet.

    - id: controlled_scale
      label: "Phase 2 · Controlled scale"
      window: [2026-08-10, 2026-08-30]
      objective: "Scale on a repaired signal, measured on cost-per-order."
      allowed:
        - fiverr_ads
        - new_gig_launch
        - brief_response_ownership
        - aov_expansion
        - unique_client_growth

  # ALL THREE must be true to advance. Checked every run.
  gate:
    - id: success_score_9
      metric: success_score
      min: 9
      source: "Level Overview page"
    - id: impressions_4000
      metric: impressions_7d_ma
      min: 4000
    - id: completion_ratio_5d
      metric: completion_ratio_consecutive_days_at_or_above_1
      min: 5

  # Conditions that stop the plan rather than continue it.
  kill_criteria:
    - id: impressions_flat_at_gate
      when: "impressions_7d_ma < 2000 on 2026-08-20 with Phase 1 actions at 100%"
      response: >
        The cause is outside the control set. Stop spending effort here, shift
        volume weighting to Dygram and Storm, treat XStudioz as a rebuild.
    - id: success_score_7
      when: "success_score <= 7"
      response: "Stop all inorganic immediately. Below 7 you lose brief routing entirely."
    - id: any_cancellation
      when: "cancellations_since_phase_start > 0"
      response: "Full post-mortem the same day, before the next order is accepted."
    - id: completion_below_1
      when: "completion_ratio below 1.0 for 5 consecutive days"
      response: "Stop accepting new orders on the branding kit gig until the queue drains."

